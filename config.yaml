# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      tiny-stable-diffusion Configuration                   ║
# ║                   Stable Diffusion 3 Style Pipeline from Scratch           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Current training stage: "vae_train" or "diffusion_train"
training_stage: vae_train

# ┌───────────────────────────────────────────────────────────────────────────┐
# │                         Stage 1: VAE Training                             │
# │                    Image Compression to Latent Space                      │
# └───────────────────────────────────────────────────────────────────────────┘
vae_train:
  # ─── Dataset ───────────────────────────────────────────────────────────────
  dataset_name: hmu013/LAION-300k
  image_field: png
  caption_field: json                 # Caption nested in json: {"caption": "..."}
  split: train
  stream: true                        # Streaming mode for large datasets

  # ─── Streaming Options ─────────────────────────────────────────────────────
  buffer_size: 5000                   # Shuffle buffer size
  skip_failures: true                 # Skip failed URL downloads
  url_timeout: 10                     # Timeout for URL requests (seconds)
  max_retries: 3                      # Max retries for failed requests

  # ─── DataLoader ────────────────────────────────────────────────────────────
  num_workers: 8                      # Worker processes (0 = main process only)
  prefetch_factor: 2                  # Batches to prefetch per worker

  # ─── Image Settings ────────────────────────────────────────────────────────
  image_size: 64                      # Input image size

  # ─── VAE Architecture ──────────────────────────────────────────────────────
  latent_channels: 16                 # SD3 style (16 channels)
  vae_ch: 64                          # Base channel count (lightweight)
  vae_ch_mult: [1, 2, 4, 4]           # f8 compression: 64 -> 8

  # ─── Training Hyperparameters ──────────────────────────────────────────────
  epochs: 100
  batch_size: 256
  learning_rate: 4.0e-4

  # ─── KL Annealing ──────────────────────────────────────────────────────────
  # Reference: "Cyclical Annealing Schedule: A Simple Approach to Mitigating KL Vanishing"
  kl_weight: 0.000001                 # Low KL weight (reconstruction-focused)
  kl_annealing: cyclical              # Options: "none", "linear", "cyclical"
  kl_n_cycles: 4                      # Number of cycles for cyclical annealing
  kl_cycle_ratio: 0.5                 # Proportion of cycle spent increasing

  # ─── Training Settings ─────────────────────────────────────────────────────
  mixed_precision: false
  device: auto
  seed: 42

  # ─── Validation ──────────────────────────────────────────────────────────
  val_split: 0.1                      # Fraction of data for validation (0.0-1.0)
  validation_interval: 10             # Generate samples every N epochs

  # ─── Checkpoint ────────────────────────────────────────────────────────────
  checkpoint_path: checkpoints/vae.pt
  checkpoint_interval: 10             # Save every N epochs
  resume: false                       # Resume from checkpoint

# ┌───────────────────────────────────────────────────────────────────────────┐
# │                       Stage 2: Diffusion Training                         │
# │                    Text-to-Image Generation on Latent Space               │
# └───────────────────────────────────────────────────────────────────────────┘
diffusion_train:
  # ─── Model Type ────────────────────────────────────────────────────────────
  # "dit"   : Diffusion Transformer
  # "mmdit" : Multi-Modal DiT (SD3 style)
  model_type: mmdit

  # ─── Dataset ───────────────────────────────────────────────────────────────
  # Conceptual Captions 3M (WebDataset format): ~3.3M image-caption pairs
  dataset_name: pixparse/cc3m-wds
  image_field: jpg
  caption_field: txt
  split: train
  stream: true                       # Streaming for efficient loading
  use_webdataset: true               # Use webdataset library for tar files

  # Alternative datasets:
  # - clip-benchmark/wds_mscoco_captions: ~590K (WebDataset, use_webdataset: false)
  # - google-research-datasets/conceptual_captions: 3.3M (URL-based, slower)

  # ─── DataLoader ────────────────────────────────────────────────────────────
  num_workers: 4
  prefetch_factor: 2

  # ─── Image & Latent Settings ───────────────────────────────────────────────
  image_size: 64                      # Original image size
  latent_size: 8                      # Latent spatial size (64 / 8 = 8)
  in_channels: 16                     # Latent channels (matches VAE)

  # ─── Model Architecture ────────────────────────────────────────────────────
  # Model sizes (approximate params):
  #   DiT:   S=40M,  B=159M, L=559M, XL=824M
  #   MMDiT: S=87M,  B=187M, L=559M, XL=780M
  model_size: B
  patch_size: 2                       # Patch size for image tokenization
  qk_rmsnorm: true                    # MMDiT: QK RMSNorm
  register_tokens: 0                  # MMDiT: Register tokens

  # ─── Training Hyperparameters ──────────────────────────────────────────────
  epochs: 1000
  batch_size: 256
  learning_rate: 3.0e-4

  # ─── VAE Settings ──────────────────────────────────────────────────────────
  vae_checkpoint: checkpoints/vae.pt
  scaling_factor: 0.4869              # Pre-computed from dataset (latent std: 2.0537)

  # ─── CFG (Classifier-Free Guidance) ────────────────────────────────────────
  # Dropout gradually increases from initial to final over warmup epochs
  initial_cfg_prob: 0.0               # Start with no unconditional dropout
  final_cfg_prob: 0.1                 # 10% unconditional dropout after warmup
  cfg_warmup_epochs: 10               # Epochs to reach final_cfg_prob

  # ─── Diffusion Settings (Rectified Flow) ───────────────────────────────────
  num_timesteps: 1000
  guidance_scale: 7.5

  # ─── Min-SNR Loss Weighting ───────────────────────────────────────────────
  # Reference: "Efficient Diffusion Training via Min-SNR Weighting Strategy" (ICCV 2023)
  # Clamps loss weights for high-SNR timesteps, improving training efficiency (3.4x faster)
  min_snr_gamma: 5.0                  # Recommended value from paper (null to disable)

  # ─── Timestep Sampling (SD3 Logit-Normal) ──────────────────────────────────
  use_logit_normal_sampling: true
  logit_mean: 0.0
  logit_std: 1.0

  # ─── EMA (Exponential Moving Average) ──────────────────────────────────────
  use_ema: true
  ema_decay: 0.9999

  # ─── Training Settings ─────────────────────────────────────────────────────
  mixed_precision: false
  device: auto
  seed: 42

  # ─── Checkpoint ────────────────────────────────────────────────────────────
  checkpoint_path: checkpoints/diffusion.pt
  checkpoint_dir: checkpoints
  checkpoint_interval: 10             # Save every N epochs
  resume: false                       # Resume from checkpoint

  # ─── Validation ────────────────────────────────────────────────────────────
  val_split: 0.1                      # Fraction of data for validation (0.0-1.0)
  validation_prompts:
    - a cat sitting on a couch
    - a dog running in a park
    - a person riding a bicycle
    - a bus on a city street
    - a pizza on a wooden table
  validation_interval: 10             # Generate samples every N epochs
  sample_dir: results/diffusion       # Directory for generated samples

# ┌───────────────────────────────────────────────────────────────────────────┐
# │                         HuggingFace Hub Settings                          │
# └───────────────────────────────────────────────────────────────────────────┘
# ┌───────────────────────────────────────────────────────────────────────────┐
# │                       Stage 3: Motion Module Training                     │
# │                    AnimateDiff-style Video/GIF Generation                 │
# └───────────────────────────────────────────────────────────────────────────┘
motion_train:
  # ─── Model Checkpoints ─────────────────────────────────────────────────────
  vae_checkpoint: checkpoints/vae.pt
  base_checkpoint: checkpoints/diffusion.pt

  # ─── Motion Module Architecture ────────────────────────────────────────────
  motion_num_layers: 2                # Temporal transformer layers
  motion_num_heads: 8                 # Attention heads
  num_frames: 16                      # Frames per video clip

  # ─── Dataset ───────────────────────────────────────────────────────────────
  use_synthetic_data: true            # Use synthetic data for testing
  synthetic_size: 1000                # Number of synthetic videos
  synthetic_pattern: moving_circle    # Pattern: moving_circle, gradient, noise

  # For real video data (set use_synthetic_data: false):
  # dataset_name: sayakpaul/ucf101-subset
  # video_field: video
  # caption_field: label

  # ─── Image/Latent Settings ─────────────────────────────────────────────────
  image_size: 64
  latent_size: 8
  latent_channels: 16
  scaling_factor: 0.4869

  # ─── Training Hyperparameters ──────────────────────────────────────────────
  epochs: 100
  batch_size: 4                       # Smaller due to video memory
  learning_rate: 1.0e-4
  gradient_accumulation: 4            # Effective batch = 16
  max_grad_norm: 1.0

  # ─── DataLoader ────────────────────────────────────────────────────────────
  num_workers: 4
  prefetch_factor: 2

  # ─── Diffusion Settings ────────────────────────────────────────────────────
  num_timesteps: 1000
  guidance_scale: 7.5
  min_snr_gamma: 5.0
  temporal_consistency_weight: 0.0    # Extra loss for smooth motion

  # ─── CFG Settings ──────────────────────────────────────────────────────────
  initial_cfg_prob: 0.0
  final_cfg_prob: 0.1
  cfg_warmup_epochs: 10

  # ─── EMA ────────────────────────────────────────────────────────────────────
  use_ema: true
  ema_decay: 0.9999

  # ─── Training Settings ─────────────────────────────────────────────────────
  mixed_precision: false                # Enable AMP (Automatic Mixed Precision)
  gradient_checkpointing: false         # Trade compute for memory savings
  device: auto
  seed: 42

  # ─── Checkpoint ────────────────────────────────────────────────────────────
  checkpoint_path: checkpoints/motion.pt
  checkpoint_dir: checkpoints
  checkpoint_interval: 10
  resume: false

  # ─── Validation ────────────────────────────────────────────────────────────
  validation_prompts:
    - a moving circle animation
    - an animated shape
    - a simple motion
  validation_interval: 10
  sample_dir: results/motion

# ┌───────────────────────────────────────────────────────────────────────────┐
# │                         HuggingFace Hub Settings                          │
# └───────────────────────────────────────────────────────────────────────────┘
hub:
  push_to_hub: false                  # Push to HF Hub after training
  model_id: null                      # Repository ID (e.g., "username/tiny-sd-vae")
  private: false                      # Create private repository
  # token: null                       # Use HF_TOKEN env var instead

# ┌───────────────────────────────────────────────────────────────────────────┐
# │                         Evaluation Settings                               │
# └───────────────────────────────────────────────────────────────────────────┘
evaluation:
  metrics: [fid, clip_fid, is, clip_score]
  num_eval_samples: 1000
  eval_batch_size: 32
  eval_num_steps: 50
  eval_guidance_scale: 7.5
  eval_seed: 42
  results_dir: results/evaluation

benchmark:
  warmup_runs: 3
  num_steps_list: [10, 25, 50, 100]
  batch_sizes: [1, 4, 8]
  benchmark_prompt: "a cat sitting on a couch"
  results_dir: results/benchmarks
